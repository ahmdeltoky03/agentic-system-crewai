[project]
name = "sports_analytics_platform"
version = "0.1.0"
description = "sports_analytics_platform using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "agentops>=0.4.21",
    "crewai[google-genai,litellm,tools]==1.14.3",
]

[project.scripts]
sports_analytics_platform = "sports_analytics_platform.main:run"
run_crew = "sports_analytics_platform.main:run"
train = "sports_analytics_platform.main:train"
replay = "sports_analytics_platform.main:replay"
test = "sports_analytics_platform.main:test"
run_with_trigger = "sports_analytics_platform.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
